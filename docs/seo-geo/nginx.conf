# nginx.conf fragment — finradun.ru
# =========================================
# Вставить в server block для finradun.ru

server {
    listen 443 ssl http2;
    server_name finradun.ru www.finradun.ru;

    ssl_certificate     /etc/ssl/certs/finradun.ru.crt;
    ssl_certificate_key /etc/ssl/private/finradun.ru.key;

    root /root/www/finradun;
    index index.html;

    # === Content-Usage Header ===
    add_header Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source" always;

    # === Security Headers ===
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === CORS — allow AI search crawlers ===
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

    # === Proxy to Next.js (PM2 on port 3002) ===
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # === Static assets — aggressive caching ===
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico)$ {
        proxy_pass http://127.0.0.1:3002;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source" always;
    }

    location ~* \.(css|js)$ {
        proxy_pass http://127.0.0.1:3002;
        expires 1M;
        add_header Cache-Control "public";
        add_header Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source" always;
    }

    # === LLM-friendly files — always accessible ===
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3002;
        add_header Content-Type "text/plain" always;
        add_header Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source" always;
    }

    location = /ai.txt {
        proxy_pass http://127.0.0.1:3002;
        add_header Content-Type "text/plain" always;
        add_header Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source" always;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:3002;
        add_header Content-Type "text/plain" always;
        add_header Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source" always;
    }

    location = /llms-full.txt {
        proxy_pass http://127.0.0.1:3002;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source" always;
    }

    # === Sitemap ===
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3002;
        add_header Content-Type "application/xml" always;
    }

    # === Manifest ===
    location = /manifest.json {
        proxy_pass http://127.0.0.1:3002;
        add_header Content-Type "application/json" always;
    }

    # === Block AI training crawlers (supplementary to robots.txt) ===
    if ($http_user_agent ~* (GPTBot|CCBot|Bytespider|FacebookBot|Amazonbot|Applebot-Extended|cohere-ai|Diffbot|ImagesiftBot|KangarooBot|omgili)) {
        return 403;
    }

    # === Redirect www to non-www ===
    if ($host = www.finradun.ru) {
        return 301 https://finradun.ru$request_uri;
    }

    # === Gzip ===
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name finradun.ru www.finradun.ru;
    return 301 https://finradun.ru$request_uri;
}
