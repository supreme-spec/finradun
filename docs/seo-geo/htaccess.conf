# .htaccess — finradun.ru (Apache)
# =========================================

# Content-Usage Header
Header always set Content-Usage "search-indexing-allowed, ai-training-disallowed, citation-allowed-with-source"

# Security Headers
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set X-XSS-Protection "1; mode=block"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# HTTPS redirect
RewriteEngine On
RewriteCond %{HTTPS} off
RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

# Canonical: remove trailing slash (except root)
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.*)/$ /$1 [L,R=301]

# Caching — static assets
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/webp "access plus 1 year"
  ExpiresByType image/png "access plus 1 year"
  ExpiresByType image/jpeg "access plus 1 year"
  ExpiresByType image/svg+xml "access plus 1 year"
  ExpiresByType text/css "access plus 1 month"
  ExpiresByType application/javascript "access plus 1 month"
  ExpiresByType application/json "access plus 1 hour"
  ExpiresByType text/html "access plus 0 seconds"
</IfModule>

# Gzip compression
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>

# Block AI training crawlers by IP pattern (supplementary to robots.txt)
# These are common patterns; adjust based on actual access logs
RewriteCond %{HTTP_USER_AGENT} ^.*GPTBot.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*CCBot.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*Bytespider.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*FacebookBot.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*Amazonbot.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*Applebot-Extended.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*cohere-ai.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*Diffbot.*$ [NC]
RewriteRule ^ - [F]
RewriteCond %{HTTP_USER_AGENT} ^.*ImagesiftBot.*$ [NC]
RewriteRule ^ - [F]

# Custom error pages
ErrorDocument 404 /_not-found
ErrorDocument 500 /_not-found
